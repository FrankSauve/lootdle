services:
  # Development: `docker compose up` -> http://localhost:5173
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep Linux node_modules inside a Docker volume instead of your Windows folder.
      - node_modules:/app/node_modules
    environment:
      VITE_USE_POLLING: "true"
    # Re-sync packages on every start, so package.json changes don't need an image rebuild.
    command: sh -c "npm install && npm run dev"

  # Production preview: `docker compose --profile prod up --build web` -> http://localhost:8080
  web:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"

volumes:
  node_modules:
